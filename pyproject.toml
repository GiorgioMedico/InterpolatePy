[build-system]
requires = ["scikit-build-core>=1.0,<2", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "InterpolatePy"
authors = [{ name = "Giorgio Medico", email = "giorgio.medico11@gmail.com" }]
maintainers = [
    { name = "Giorgio Medico", email = "giorgio.medico11@gmail.com" },
]
description = "A comprehensive Python library for generating smooth trajectories and curves with precise control over position, velocity, acceleration, and jerk profiles"
readme = "README.md"
version = "3.2.1"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "interpolation",
    "trajectory planning",
    "motion profiles",
    "robotics",
    "b-splines",
    "cubic splines",
    "frenet frames",
    "path generation",
    "motion control",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: C++",
]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]

[project.urls]
"Homepage" = "https://github.com/GiorgioMedico/InterpolatePy"
"Bug Tracker" = "https://github.com/GiorgioMedico/InterpolatePy/issues"

[dependency-groups]
test = [
    "matplotlib>=3.6",
    "pytest>=8.4.0",
    "pytest-cov>=4.1.0",
    "codecov>=2.1.13",
    "pytest-benchmark>=4.0.0",
    "pre-commit>=4.2.0",
]
dev = [
    "ruff>=0.12.8",
    "mypy>=1.17.0",
    "pre-commit>=4.2.0",
    "pyright>=1.1.400",
    "build>=1.0.3",
    "twine>=4.0.2",
]
docs = [
    "matplotlib>=3.6",
    "mkdocs>=1.5.3,<2",
    "mkdocs-material>=9.4.8",
    "pymdown-extensions>=10.3.0",
    "mkdocs-autorefs>=0.5.0",
    "mkdocstrings>=0.23.0",
    "mkdocstrings-python>=1.7.3",
    "Pygments>=2.16.1",
]
examples = [
    "matplotlib>=3.6",
    "PyQt6>=6.5",
]

[tool.uv]
default-groups = ["dev", "test", "examples"]

[tool.scikit-build]
cmake.source-dir = "cpp"
cmake.build-type = "Release"
cmake.args = [
    "-DINTERPOLATECPP_BUILD_BINDINGS=ON",
    "-DINTERPOLATECPP_BUILD_EXAMPLES=OFF",
    "-DINTERPOLATECPP_BUILD_TESTS=OFF",
]
install.components = ["python"]
sdist.include = [
    "cpp/CMakeLists.txt",
    "cpp/bindings",
    "cpp/cmake",
    "cpp/examples",
    "cpp/include",
    "cpp/src",
    "cpp/tests",
    "src/interpolatepy/**/*.py",
    "src/interpolatepy/py.typed",
]
sdist.exclude = [
    "cpp/build",
    "src/interpolatepy/**/__pycache__/**",
    "src/interpolatepy/**/*.pyc",
    "src/interpolatepy/**/*.pyo",
]
wheel.packages = ["src/interpolatepy"]
wheel.reproducible = true

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*"]
build-frontend = "build"
test-command = "pytest {project}/tests/test_backend.py {project}/tests/test_native_adapter_api.py"
test-requires = ["pytest>=8.4", "matplotlib>=3.6"]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
preview = true
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["F", "E"]
extend-select = [
    "W",
    "C90",
    "I",     # isort rules
    "N",
    "UP",
    "YTT",
    "ANN",
    "ASYNC",
    "BLE",
    "B",
    "A",
    "COM",
    "C4",
    "EXE",
    "FA",
    "ISC",
    "ICN",
    "INP",
    "PIE",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TCH",
    "INT",
    "ARG",
    "PTH",
    "TD",
    "FIX",
    "PD",
    "PL",
    "TRY",
    "FLY",
    "NPY",
    "PERF",
    "RUF",
]
ignore = [
    "I001",
    "ANN401",
    "SIM300",
    "PERF203",
    "B905",
    "NPY002",
    "COM812",
    "N999",
    "PTH",
    "INP001",
    "TRY003",
    "PLW1641",
    "PLR0914", # Too many local variables
    "PLR0915", # Too many statements
    "PLR0917", # Too many arguments
    "PLR0904", # Too many public methods
    "C901",
    "PLR0912",
]
fixable = [
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    "ANN",
    "ASYNC",
    "BLE",
    "B",
    "A",
    "COM",
    "C4",
    "EXE",
    "FA",
    "ISC",
    "ICN",
    "INP",
    "PIE",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TCH",
    "INT",
    "ARG",
    "PTH",
    "TD",
    "FIX",
    "PD",
    "PL",
    "TRY",
    "FLY",
    "NPY",
    "PERF",
    "RUF",
]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = false
lines-after-imports = 2
known-third-party = ["numpy", "matplotlib", "scipy"]
split-on-trailing-comma = true
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.lint.mccabe]
max-complexity = 24

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false

[tool.ruff.lint.per-file-ignores]
"src/interpolatepy/**/__init__.py" = ["RUF067"]
"tests/**/*.py" = [
    "ANN202",
    "ARG001",
    "BLE001",
    "E226",
    "F401",
    "F841",
    "N806",
    "PLC0415",
    "PLC2701",
    "PLR2004",
    "PLR6201",
    "PLR6301",
    "PLW0127",
    "PLW0128",
    "PT001",
    "PT012",
    "PT013",
    "PT019",
    "PT031",
    "RUF043",
    "RUF059",
    "RUF069",
    "RET504",
    "SIM108",
    "SLF001",
]

# Ruff formatter (replaces black)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
# Black-compatible settings
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
no_implicit_optional = true
strict_optional = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_return_any = false
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = true
disallow_untyped_decorators = false
disallow_subclassing_any = true
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
allow_untyped_globals = false
allow_redefinition = false
local_partial_types = false
implicit_reexport = true
strict_equality = true
show_error_context = false
show_column_numbers = false
show_error_codes = true
exclude = ["docs"]

[tool.coverage.run]
branch = true
source = ["interpolatepy"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportDuplicateImport = true
reportInvalidStubStatement = true
reportOverlappingOverload = true
reportPropertyTypeMismatch = true
reportUntypedClassDecorator = true
reportUntypedFunctionDecorator = true
reportUntypedNamedTuple = true
reportUnusedImport = true
reportGeneralTypeIssues = true
reportMissingModuleSource = false
reportOptionalCall = true
reportOptionalIterable = true
reportOptionalMemberAccess = true
reportOptionalOperand = true
reportOptionalSubscript = true
reportPrivateImportUsage = true
reportUnboundVariable = true
