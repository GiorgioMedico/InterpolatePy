name: Documentation

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'README.md'
      - 'ALGORITHMS.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/interpolatepy/**/*.py'  # Only Python files for API docs
      - 'scripts/check_doc_snippets.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'ALGORITHMS.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/interpolatepy/**/*.py'
      - 'scripts/check_doc_snippets.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Sync dependencies
      run: uv sync --locked --no-default-groups --group docs --no-install-project

    - name: Check documentation snippets
      env:
        INTERPOLATEPY_NO_CPP: '1'
        MPLBACKEND: Agg
        PYTHONPATH: src
      run: uv run --no-sync python -m scripts.check_doc_snippets

    - name: Build documentation
      env:
        INTERPOLATEPY_NO_CPP: '1'
        PYTHONPATH: src
      run: uv run --no-sync mkdocs build --clean --strict

    - name: Setup Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/configure-pages@v6

    - name: Upload artifact
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
